<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animated 3D capture fixture</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #101a32; color: #f5f8ff; font: 16px system-ui, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .label { position: fixed; top: 20px; left: 24px; pointer-events: none; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    p { margin: 0; color: #b9d4f5; }
    #error { display: none; position: fixed; inset: 50% auto auto 50%; transform: translate(-50%, -50%); width: min(90vw, 640px); padding: 24px; background: #572231; border: 2px solid #ff9aa5; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="label"><h1>Animated 3D capture fixture</h1><p>Rotating cube and orbiting spheres</p></div>
  <div id="error" role="alert"></div>
  <script type="module">
    const error = document.querySelector('#error');
    function showError(message) {
      error.textContent = `Unable to render the scene: ${message}`;
      error.style.display = 'block';
    }
    window.addEventListener('error', event => showError(event.message));
    window.addEventListener('unhandledrejection', event => showError(String(event.reason)));

    try {
      const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x101a32);
      const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
      camera.position.set(0, 2.2, 9);
      camera.lookAt(0, 0, 0);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      document.body.prepend(renderer.domElement);
      scene.add(new THREE.HemisphereLight(0xd4edff, 0x293353, 2));
      const light = new THREE.DirectionalLight(0xffffff, 2.5);
      light.position.set(4, 6, 8);
      scene.add(light);

      const cube = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), new THREE.MeshStandardMaterial({ color: 0x23bcd2, roughness: 0.35, metalness: 0.2 }));
      scene.add(cube);
      cube.add(new THREE.LineSegments(new THREE.EdgesGeometry(cube.geometry), new THREE.LineBasicMaterial({ color: 0xffffff })));
      const spheres = [0xffbd36, 0xff5984, 0x91ed7a].map(color => {
        const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.32, 24, 16), new THREE.MeshStandardMaterial({ color, roughness: 0.35 }));
        scene.add(sphere);
        return sphere;
      });
      window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
      renderer.setAnimationLoop(time => {
        const seconds = time / 1000;
        cube.rotation.set(seconds * 0.5, seconds * 0.8, seconds * 0.2);
        spheres.forEach((sphere, i) => {
          const angle = seconds * 1.3 + i * Math.PI * 2 / spheres.length;
          sphere.position.set(Math.cos(angle) * 3, Math.sin(angle * 1.5) * 1.3, Math.sin(angle) * 1.5);
        });
        renderer.render(scene, camera);
      });
    } catch (err) {
      showError(String(err));
    }
  </script>
</body>
</html>
